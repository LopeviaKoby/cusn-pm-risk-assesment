# Paquete de despliegue del laboratorio GPL.
# La base y la API no publican puertos: solo el frontend queda expuesto.
name: gpl-pmo

x-api-image: &api-image
  build:
    context: .
    dockerfile: app/api/Dockerfile
  image: gpl-pmo-api:local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo}
      POSTGRES_USER: ${POSTGRES_USER:-pmo_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pmo-data:/var/lib/postgresql
    networks:
      - pmo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    <<: *api-image
    restart: "no"
    command: ["bun", "run", "app/api/scripts/migrate.ts", "--mode=${DB_MIGRATE_MODE:-schema}"]
    environment:
      MIGRATOR_DATABASE_URL: postgres://${POSTGRES_USER:-pmo_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pmo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pmo
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  bootstrap:
    <<: *api-image
    restart: "no"
    command: ["bun", "run", "app/api/scripts/bootstrap-db.ts"]
    environment:
      MIGRATOR_DATABASE_URL: postgres://${POSTGRES_USER:-pmo_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pmo}
      APP_DB_ROLE: ${APP_DB_ROLE:-pmo_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pmo
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  verify:
    <<: *api-image
    restart: "no"
    command: ["bun", "run", "app/api/scripts/verify-db.ts"]
    environment:
      DATABASE_URL: postgres://${APP_DB_ROLE:-pmo_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-pmo}
      EXPECT_PROJECTS: ${EXPECT_PROJECTS:-}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - pmo
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${APP_DB_ROLE:-pmo_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-pmo}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-5}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      verify:
        condition: service_completed_successfully
    networks:
      - pmo
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/api/v1/listo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpl-pmo-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pmo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  pmo-data:

networks:
  pmo:
    driver: bridge
