worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $uri $cache_control { default ""; /index.html "no-cache"; }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $cache_control always;

        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~ /\. { return 404; }
        location ^~ /assets/ { try_files $uri =404; }
        location ^~ /licenses/ { try_files $uri =404; }
        location ~* \.[^/]+$ { try_files $uri =404; }
        location = /index.html { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
