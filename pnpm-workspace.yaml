registry: https://registry.npmjs.org/
strictSsl: true
saveExact: true
engineStrict: true
strictPeerDependencies: true
overrides:
  glob@13.0.6: 14.0.2
  minimatch@10.2.6: 11.0.1
  fast-uri@3.1.8: 3.1.9
autoInstallPeers: false
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Owner authorized 2026-10-22: legacy Babel dependency of react-doctor@0.9.18.
# Remove when the reviewed Doctor tree no longer needs this exact version.
trustPolicyExclude:
  - semver@6.3.1
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild@0.28.2: true
skills:
  dirs: []
pmOnFail: ignore
verifyDepsBeforeRun: error
