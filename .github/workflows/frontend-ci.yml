name: PMO application checks
on:
  push:
    branches: [dev, dev-tvt-foundry, main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: msedge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.12.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run check:distribution
      - run: pnpm run test:e2e
  supply-chain:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.12.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm audit signatures
      - run: pnpm ls --depth Infinity
      - run: pnpm run build
      - name: Scan frontend and workflow sources
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          foreach ($target in @('app', 'scripts', 'tests', '.github', 'dist', 'package.json', 'pnpm-lock.yaml')) {
            & (Join-Path $destination 'gitleaks.exe') dir $target --redact --no-banner
            if ($LASTEXITCODE -ne 0) { throw "Gitleaks failed: $target" }
          }
      - run: pnpm run check:react
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_DB: pmo_test_ci
          POSTGRES_USER: pmo_owner
          POSTGRES_PASSWORD: ci-only-pmo-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmo_owner -d pmo_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.12.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:api
      - name: Test API and versioned migrations on isolated PostgreSQL
        shell: bash
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/app" -w /app oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a bun test app/api/tests/unit
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/app" -w /app -e NODE_ENV=test -e TEST_DATABASE_URL=postgres://pmo_owner:ci-only-pmo-test@127.0.0.1:5432/pmo_test_ci oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a bun run app/api/tests/db-smoke.ts
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/app" -w /app -e MIGRATOR_DATABASE_URL=postgres://pmo_owner:ci-only-pmo-test@127.0.0.1:5432/pmo_test_ci oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a bun run app/api/scripts/generate-models.ts --check
      - run: docker build -f app/api/Dockerfile -t pmo-api-ci .
